<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Painel do Mestre</title>
</head>
<body>
    <h1>Controle do Mestre - Sala: <span id="roomIdDisplay"></span></h1>
    
    <button id="startStream">Iniciar Transmissão (OBS Virtual Cam)</button>
    <video id="gmVideo" autoplay muted></video>

    <hr>
    <h3>Efeitos Sonoros</h3>
    <button onclick="playSFX('https://exemplo.com/espada.mp3')">Som de Espada</button>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const roomId = 'sala-secreta-123'; // Pode ser gerado dinamicamente
        document.getElementById('roomIdDisplay').innerText = roomId;

        socket.emit('join-room', roomId, 'gm');

        // Capturar câmera do mestre (OBS Virtual Camera aparece aqui)
        let localStream;
        document.getElementById('startStream').addEventListener('click', async () => {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('gmVideo').srcObject = localStream;
        });

        // Função para tocar SFX remotamente
        function playSFX(url) {
            socket.emit('play-audio', roomId, { type: 'sfx', url: url });
        }

        // Lógica de WebRTC (Oferta/Resposta) entraria aqui para enviar o 'localStream'
        // para os IDs que chegam no evento 'player-joined'
    </script>
</body>
</html>
