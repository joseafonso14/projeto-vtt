<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Visão do Jogador</title>
    <style>
        body { background-color: #111; color: white; text-align: center; }
        video, img { max-width: 100%; height: auto; }
    </style>
</head>
<body>
    <div id="mediaContainer">
        <video id="playerVideo" autoplay></video>
        <img id="playerImage" style="display:none;">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room'); // Pega a sala pela URL (ex: ?room=sala-secreta-123)

        socket.emit('join-room', roomId, 'player');

        // Receber comandos de áudio
        socket.on('audio-command', (data) => {
            if (data.type === 'sfx') {
                const audio = new Audio(data.url);
                audio.play();
            }
        });

        // Receber imagem estática
        socket.on('update-image', (url) => {
            document.getElementById('playerVideo').style.display = 'none';
            const img = document.getElementById('playerImage');
            img.src = url;
            img.style.display = 'block';
        });

        // A lógica do WebRTC para receber o stream de vídeo e setar no 'playerVideo'
        // seria implementada aqui, respondendo às 'webrtc-offer' do mestre.
    </script>
</body>
</html>
